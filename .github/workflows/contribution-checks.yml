name: Contribution checks
# Fork-only. Mirrors the Linux jobs of upstream .github/workflows/ci.yml
# (esbuild CI on ubuntu-latest, Slow Tests, All Platforms, old Go version).
# Every test step runs even after an earlier failure, so one run shows every
# failing step. Step names are unique across jobs.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Contribution branch or commit to check
        required: true
        type: string

permissions:
  contents: read

jobs:
  esbuild:
    name: esbuild CI (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Show commit
        run: git rev-parse HEAD
      - name: Read go.version
        run: echo "GO_VERSION=$(cat go.version)" >> $GITHUB_ENV
      - name: Set up Go
        uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # actions/setup-go@v3
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up Node 18
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # actions/setup-node@v3
        with:
          node-version: 18
      - name: go test
        if: ${{ !cancelled() }}
        run: go test -race ./cmd/... ./internal/... ./pkg/...
      - name: go vet
        if: ${{ !cancelled() }}
        run: go vet ./cmd/... ./internal/... ./pkg/...
      - name: Test for path/filepath
        if: ${{ !cancelled() }}
        run: make no-filepath
      - name: Make sure check-go-version works
        if: ${{ !cancelled() }}
        run: make check-go-version
      - name: go fmt
        if: ${{ !cancelled() }}
        run: make fmt-go
      - name: npm ci
        if: ${{ !cancelled() }}
        run: cd scripts && npm ci
      - name: Register Test (ESBUILD_WORKER_THREADS=0)
        if: ${{ !cancelled() }}
        run: ESBUILD_WORKER_THREADS=0 node scripts/register-test.js
      - name: Register Test
        if: ${{ !cancelled() }}
        run: node scripts/register-test.js
      - name: Verify Source Map
        if: ${{ !cancelled() }}
        run: node scripts/verify-source-map.js
      - name: E2E Tests
        if: ${{ !cancelled() }}
        run: node scripts/end-to-end-tests.js
      - name: JS API Tests (ESBUILD_WORKER_THREADS=0)
        if: ${{ !cancelled() }}
        run: ESBUILD_WORKER_THREADS=0 node scripts/js-api-tests.js
      - name: JS API Tests
        if: ${{ !cancelled() }}
        run: node scripts/js-api-tests.js
      - name: NodeJS Unref Tests
        if: ${{ !cancelled() }}
        run: node scripts/node-unref-tests.js
      - name: Plugin Tests
        if: ${{ !cancelled() }}
        run: node scripts/plugin-tests.js
      - name: TypeScript Type Definition Tests
        if: ${{ !cancelled() }}
        run: node scripts/ts-type-tests.js
      - name: JS API Type Check
        if: ${{ !cancelled() }}
        run: make lib-typecheck
      - name: Decorator Tests
        if: ${{ !cancelled() }}
        run: make decorator-tests
      - name: WebAssembly API Tests (browser)
        if: ${{ !cancelled() }}
        run: make test-wasm-browser
      - name: WebAssembly API Tests (node, Linux)
        if: ${{ !cancelled() }}
        run: make test-wasm-node
      - name: Sucrase Tests
        if: ${{ !cancelled() }}
        run: make test-sucrase
      - name: Esprima Tests
        if: ${{ !cancelled() }}
        run: make test-esprima
      - name: Preact Splitting Tests
        if: ${{ !cancelled() }}
        run: make test-preact-splitting
      - name: Check the unicode table generator
        if: ${{ !cancelled() }}
        run: cd scripts && node gen-unicode-table.js
      - name: Yarn PnP tests
        if: ${{ !cancelled() }}
        run: |
          corepack enable
          make test-yarnpnp

  esbuild-slow:
    name: esbuild CI (Slow Tests)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Show commit (slow)
        run: git rev-parse HEAD
      - name: Read go.version
        run: echo "GO_VERSION=$(cat go.version)" >> $GITHUB_ENV
      - name: Set up Go
        uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # actions/setup-go@v3
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up Node 16
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # actions/setup-node@v3
        with:
          node-version: 16
      - name: Rollup Tests
        if: ${{ !cancelled() }}
        run: make test-rollup
      - name: Uglify Tests
        if: ${{ !cancelled() }}
        run: CI=1 make uglify
      - name: Type check tsc using tsc
        if: ${{ !cancelled() }}
        run: make test-tsc
      - name: Test an old TypeScript version
        if: ${{ !cancelled() }}
        run: make test-old-ts
      - name: Ensure esbuild can be built for Plan 9
        if: ${{ !cancelled() }}
        run: |
          GOOS=plan9 GOARCH=386 go build ./cmd/esbuild
          GOOS=plan9 GOARCH=amd64 go build ./cmd/esbuild
          GOOS=plan9 GOARCH=arm go build ./cmd/esbuild

  esbuild-platforms:
    name: esbuild CI (All Platforms)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Show commit (platforms)
        run: git rev-parse HEAD
      - name: Read go.version
        run: echo "GO_VERSION=$(cat go.version)" >> $GITHUB_ENV
      - name: Set up Go
        uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # actions/setup-go@v3
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Set up Node 18
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # actions/setup-node@v3
        with:
          node-version: 18
      - name: Ensure all supported platforms can be built
        if: ${{ !cancelled() }}
        run: make platform-all

  esbuild-old-go-version:
    name: esbuild CI (old Go version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # actions/checkout@v3
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Show commit (old Go)
        run: git rev-parse HEAD
      - name: Set up Go 1.13
        uses: actions/setup-go@be3c94b385c4f180051c996d336f57a34c397495 # actions/setup-go@v3
        with:
          go-version: 1.13
      - name: go build (Go 1.13)
        if: ${{ !cancelled() }}
        run: go build ./cmd/esbuild
      - name: go test (Go 1.13)
        if: ${{ !cancelled() }}
        run: go test ./internal/...
